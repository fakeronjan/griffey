name: Update GRIFFEY Ratings

on:
  schedule:
    - cron: '53 16 * * *'   # 16:53 UTC daily - after COBI (16:33); MLB Stats API + Retrosheet (separate sources from sports-reference)
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write           # needed for git push

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install cython numpy
          pip install --no-build-isolation -r requirements.txt

      # Ratings cache lives in the Actions cache, NOT git (regenerable build
      # artifact - griffey.py's incremental scratchpad - and re-committing a
      # ~14MB gzip daily bloated the repo). Rolling key + prefix restore-keys; a
      # miss (first run / eviction) is safe: griffey.py rebuilds from scratch.
      # The prefix is version-tagged (w155): bump it whenever the rating window
      # or any engine change requires invalidating history, forcing a full
      # rebuild instead of an incremental tail patch on stale-window ratings.
      - name: Restore ratings cache
        uses: actions/cache/restore@v4
        with:
          path: griffey_ratings.csv.gz
          key: griffey-ratings-w155-${{ github.run_id }}
          restore-keys: griffey-ratings-w155-

      - name: Run ratings engine
        run: python griffey.py

      - name: Save ratings cache
        uses: actions/cache/save@v4
        with:
          path: griffey_ratings.csv.gz
          key: griffey-ratings-w155-${{ github.run_id }}

      - name: Generate web data
        run: python generate_data.py

      - name: Commit and push updated data
        run: |
          git config user.name  "GRIFFEY Bot"
          git config user.email "griffey-bot@users.noreply.github.com"
          git add loaded_mlb_games.csv all_mlb_games.csv docs/data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ratings $(date -u '+%Y-%m-%d')"
            # Race-safe push: if another commit landed during this run, rebase
            # the data update on top and retry. Avoids losing a day's data
            # update when a code push lands mid-cron-run.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed; retrying in 5s..."
              sleep 5
            done
          fi
